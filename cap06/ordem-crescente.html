<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordem Crescente</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: cornflowerblue;
        display: grid;
        place-content: center;
        min-height: 100vh;
      }

      main {
        display: flex;
        max-width: fit-content;
        margin-inline: auto;

        margin-top: 1rem;
        box-shadow: inset 0 0 4px black;
        border-radius: 8px;
        padding-block: 1rem;
        padding-inline: 1.5rem;
        justify-content: center;
      }

      form {
        display: flex;
        gap: 0.5rem;
      }

      h1 {
        font-size: 3rem;
        color: antiquewhite;
        filter: drop-shadow(1px 1px 1px black);
      }

      label {
        font-size: 1.5rem;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        color: white;
        filter: drop-shadow(1px 1px 1px black);
      }

      #inNumero {
        font-size: 1.2rem;
        width: 80px;
        border-radius: 6px;
      }

      .btn {
        padding-block: 4px;
        padding-inline: 8px;
        border-radius: 8px;
        font-size: 1.1rem;

        &:hover,
        &:focus,
        &:active {
          cursor: pointer;
          background-color: yellow;

          transition: all 0.3s ease-in-out;
        }
      }
    </style>
  </head>
  <body>
    <h1>Programa Números em Ordem</h1>
    <main>
      <form>
        <label for="inNumero">Número:</label>
        <input
          type="number"
          id="inNumero"
          name="numero"
          required
          autofocus
          autocomplete="off"
        />
        <input type="submit" value="Adicionar" id="btnAdd" class="btn" />
      </form>
    </main>

    <section>
        <input type="submit" value="Verificar Ordem" id="inCheck" class="btn">
        <div class="nmbr-lst">
            <ul class="order-list">
              <p class="error-msg1"></p>

            </ul>

        </div>
    </section>

    <section>

    </section>

    <div>
        <span class="alert-msg1"></span>
    </div>

    <script src="ordem.js"></script>
  </body>
</html>
