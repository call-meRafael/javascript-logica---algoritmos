<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concurso</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            place-content: center;
            gap: 1rem;

            min-height: 100dvh;
            margin-inline: auto;
        }

        header {
            margin-inline: auto;

            & > h1 {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 3rem;
                border-bottom: 2px solid rgba(0, 0, 0, 0.233);
                padding-block: 6px;

                color: antiquewhite;
                filter: drop-shadow(1px 1px 2px black);

                @media (min-width: 375px) and (max-width: 452px) {
                    font-size: 2.2rem;
                }
            }
        }

        main {
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin-inline: auto;
            box-shadow: inset 0 0 4px black;
            border-radius: 8px;

            padding-block: 1rem;
            padding-inline: 1.5rem;

            & > form {
                display: flex;
                flex-direction: column;
                gap: .5rem;
            }

            .user-box {
                display: flex;
                justify-content: space-between;
            }

            .btn-add {
                width: fit-content;
                align-self: center;
            }
        }

        .btn {
            padding-block: 8px;
            padding-inline: 1.2rem;
            border-radius: 100px;
            border: none;
            box-shadow: inset 0 0 4px black;

            font-size: 1.2rem;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: 400;

            transition: background-color 0.3s ease;

            &:hover, &:focus, &:active {
                cursor: pointer;
                background-color: beige;
            }
        }

        .ipt-layer {
            font-size: 1.1rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 2px;
            border-radius: 4px;
            border-color: beige;
            padding: 8px;

            color: black;

            &:focus, &:active, &:focus-visible {
                outline: none;
            }
        }

        .lbl-layer {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;

            &:focus, &:active {
                outline: none;
            }
        }

        .btns-label {
            display: flex;
            gap: 1rem;

        }

        .error-state {
            color: crimson;
            border-color: crimson;
            box-shadow: 0 0 4px rgb(216, 61, 92);
            
            
            &:focus {
                border: none;
            }
        }

        .no-display {
            display: none;
            visibility: hidden;
        }

        .invalid-state {
            color: crimson;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: .8rem;
            align-self: center;
            opacity: .8;
        }

        section {
            display: flex;
            max-width: 400px;
            justify-content: center;

            margin-inline: auto;
            margin-top: 1rem;
        }

        .list-box {
            position: relative;
            border-radius: .5rem;
            width: 320px;
            margin-inline: auto;
            padding-inline: 2rem;
            padding-block: 1rem;
            box-shadow: 4px 10px 20px rgba(0, 0, 0, 0.329);

            & #close-btn {
                display: flex;
                justify-content: center;
                align-items: center;
                
                position: absolute;
                right: 0;
                top: 0;
                margin-right: 5px;
                margin-top: 5px;
                

                width: 24px;
                height: 24px;
                border-radius: 100%;
                border: none;
                outline: none;

                & svg {
                    flex-shrink: 0;

                    &:hover {
                        cursor: pointer;
                        transform: scale(1.1);
                    }
                }

                
            }
        }

        .lista-total {
            /* outline: dotted 2px darkblue; */
            min-height: 300px;
            padding-block: 1rem;
            padding-inline: .5rem;

            & > li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: .5rem;

                margin-block: .5rem;
                list-style: none;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-weight: 400;
                font-size: .8rem;
            }
            
        }

    </style>
</head>
<body>
    <header>
        <h1>Programa Concurso</h1>
    </header>

    <main>
        <form action="">
            <div class="user-box">
                <label for="inCandidato" class="lbl-layer">Candidato</label>
                <span class="invalid-state no-display">inválido</span>
            </div>
            <input type="text" class="ipt-layer" name="-candidato" id="inCandidato" required autofocus placeholder="nome" autocomplete="off">

            <label for="inAcertos" class="lbl-layer">N° Acertos</label>
            <input type="number" class="ipt-layer" name="-acertos" id="inAcertos" placeholder="acertos" required autocomplete="off" oninvalid="this.setCustomValidity('Entre 0 e 400')" oninput="this.setCustomValidity('')">
            <input type="submit" value="Adicionar" class="btn-add btn">
        </form>

    </main>
    <section>
        <div class="btns-label">
            <input type="button" value="Listar Todos" class="btn" id="list-btn">
            <input type="button" value="Aprovados 2ª Etapa" class="btn">
        </div>
    </section>
    <article class="list-box no-display">
        <button type="button" id="close-btn">

            <svg height="24px" width="24px" version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512.001 512.001" xml:space="preserve" fill="#000000"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path style="fill:#FF6465;" d="M256.001,512c141.384,0,255.999-114.615,255.999-256.001C512.001,114.615,397.386,0,256.001,0 S0.001,114.615,0.001,256.001S114.616,512,256.001,512z"></path> <path style="opacity:0.1;enable-background:new ;" d="M68.873,256.001c0-129.706,96.466-236.866,221.564-253.688 C279.172,0.798,267.681,0,256.001,0C114.616,0,0.001,114.615,0.001,256.001S114.616,512.001,256,512.001 c11.68,0,23.171-0.798,34.436-2.313C165.339,492.865,68.873,385.705,68.873,256.001z"></path> <path style="fill:#FFFFFF;" d="M313.391,256.001l67.398-67.398c4.899-4.899,4.899-12.842,0-17.74l-39.65-39.65 c-4.899-4.899-12.842-4.899-17.74,0l-67.398,67.398l-67.398-67.398c-4.899-4.899-12.842-4.899-17.74,0l-39.65,39.65 c-4.899,4.899-4.899,12.842,0,17.74l67.398,67.398l-67.398,67.398c-4.899,4.899-4.899,12.842,0,17.741l39.65,39.65 c4.899,4.899,12.842,4.899,17.74,0l67.398-67.398L323.4,380.79c4.899,4.899,12.842,4.899,17.74,0l39.65-39.65 c4.899-4.899,4.899-12.842,0-17.741L313.391,256.001z"></path> </g></svg>
        </button>
        <div class="lista-total">
            

        </div>

    </article>

    <script src="app-concurso.js"></script>
</body>
</html>
