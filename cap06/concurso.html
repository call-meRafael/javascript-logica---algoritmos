<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concurso</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            place-content: center;
            gap: 1rem;

            min-height: 100dvh;
            margin-inline: auto;
        }

        header {
            margin-inline: auto;

            & > h1 {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 3rem;
                border-bottom: 2px solid rgba(0, 0, 0, 0.233);
                padding-block: 6px;

                color: antiquewhite;
                filter: drop-shadow(1px 1px 2px black);
            }
        }

        main {
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin-inline: auto;
            box-shadow: inset 0 0 4px black;
            border-radius: 8px;

            padding-block: 1rem;
            padding-inline: 1.5rem;

            & > form {
                display: flex;
                flex-direction: column;
                gap: .5rem;
            }

            .user-box {
                display: flex;
                justify-content: space-between;
            }

            .btn-add {
                width: fit-content;
                align-self: center;
            }
        }

        .btn {
            padding-block: 8px;
            padding-inline: 1.2rem;
            border-radius: 100px;
            border: none;
            box-shadow: inset 0 0 4px black;

            font-size: 1.2rem;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: 400;

            transition: background-color 0.3s ease;

            &:hover, &:focus, &:active {
                cursor: pointer;
                background-color: beige;
            }
        }

        .ipt-layer {
            font-size: 1.1rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 2px;
            border-radius: 4px;
            border-color: beige;
            padding: 8px;

            color: black;

            &:focus, &:active, &:focus-visible {
                outline: none;
            }
        }

        .lbl-layer {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;

            &:focus, &:active {
                outline: none;
            }
        }

        .btns-label {
            display: flex;
            gap: 1rem;

        }

        .error-state {
            color: crimson;
            border-color: crimson;
            box-shadow: 0 0 4px rgb(216, 61, 92);
            
            
            &:focus {
                border: none;
            }
        }

        .no-display {
            display: none;
            visibility: hidden;
        }

        .invalid-state {
            color: crimson;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: .8rem;
            align-self: center;
            opacity: .8;
        }

        section {
            display: flex;
            max-width: 400px;
            justify-content: center;

            margin-inline: auto;
            margin-top: 1rem;
        }

    </style>
</head>
<body>
    <header>
        <h1>Programa Concurso</h1>
    </header>

    <main>
        <form action="">
            <div class="user-box">
                <label for="inCandidato" class="lbl-layer">Candidato</label>
                <span class="invalid-state no-display">inválido</span>
            </div>
            <input type="text" class="ipt-layer" name="-candidato" id="inCandidato" required autofocus placeholder="nome" autocomplete="off">

            <label for="inAcertos" class="lbl-layer">N° Acertos</label>
            <input type="number" class="ipt-layer" name="-acertos" id="inAcertos" placeholder="acertos" required autocomplete="off">
            <input type="submit" value="Adicionar" class="btn-add btn">
        </form>

    </main>
    <section>
        <div class="btns-label">
            <input type="button" value="Listar Todos" class="btn">
            <input type="button" value="Aprovados 2ª Etapa" class="btn">
        </div>
    </section>
    <article>
        <div class="lista-total">

        </div>

    </article>

    <script src="app-concurso.js"></script>
</body>
</html>
