<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: cornflowerblue;

        }

        .--title {
            color: antiquewhite;
            filter: drop-shadow(1px 1px 2px black);
            font-size: 3rem;
            border-bottom-style: inset;
            padding: 8px;
        }

        .--paciente {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 2rem;

            & #inPaciente {
                font-size: 1.1rem;
                border-radius: 4px;
            }

            & .btn {
                padding-block: 4px;
                padding-inline: .5rem;
                border-radius: 100px;

                &:hover {
                    cursor: pointer;
                    background-color: beige;
                    transition: all .3s;
                }
            }
        }

        .fonte-vermelha {
            color: crimson;
        }

        pre {
            font-size: 1.2em;
        }

        .italic {
            font-style: italic;
        }

        .exibe {
            display: none;
        }

        .oculta {
            display: inline;
        }

        h3 {
            margin-top: 3rem;
        }

    </style>
</head>
<body>
    <h1 class="--title">
        Consultório Odontológico
    </h1>

    <main>
        <form action="">
            <p class="--paciente">Paciente:
                <input type="text" id="inPaciente" required autofocus>
                <input type="submit" value="Adicionar" class="btn">
                <input type="button" value="Urgência" id="btUrgencia" class="btn">
                <input type="button" value="Atender" id="btAtender" class="btn">
            </p>
        </form>
    </main>

    <h3>
        Em Atendimento:
        <span class="fonte-vermelha"></span>
    </h3>
    <pre></pre>
    



    <script src="ex01_1.js"></script>
</body>
</html>
