<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Font Family -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="shortcut icon" href="favicon-repair.png" type="image/x-icon">

    <link rel="stylesheet" href="styles/style.css">
    <title>TechFix Pro</title>
</head>
<body>
    <header class="header-wrapper">
        <div class="header-main-content">
            <img src="./no-bg-logo.png" alt="TechFix Pro Logo" class="page-logo">
            <div class="header-text">
                <h1 class="tech-title">
                    TechFix Pro
                </h1>
                <span class="tech-paragraph">
                    Reparo de aparelhos eletrônicos
                </span>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="data-wrapper">
            <p class="servico-consulta">Consulte o status do serviço</p>
            <form action="" id="data-getter">
                <div class="input-container">
                    <span class="invalid-state no-display">inválido</span>
                    
                    <input type="text" name="user" id="inUser" class="input-field" placeholder=" " required autofocus autocomplete="off">
                    <label for="inUser" class="input-label">Nome e sobrenome</label>
                </div>
                <div class="input-container">
                    <input type="text" name="aparelho" id="inAparelho" class="input-field" placeholder=" " required autocomplete="off">
                    <label for="inAparelho" class="input-label">Modelo do aparelho</label>
                </div>

                <select name="servicos" id="inServicos" class="servicos-select">

                </select>
                <input type="submit" value="Fazer consulta" id="order-btn">

            </form>

        </section>
    </main>
    

    <script src="techfix-app.js"></script>
</body>
</html>
